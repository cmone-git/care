<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stra Care - Payment Voucher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>

<link rel="stylesheet" href="style.corebiq">
</head>
<body>

<div class="module-container" id="transaction-module">
    
    

    <div class="section-title">
        <h2 class="cbx-inline-ff227d0632">Payment Vouchers</h2>
    </div>

    <div class="form-card no-print">
        <form id="transaction-form" onsubmit="event.preventDefault();">
            <input type="hidden" id="txnDocId" value="">
            
            <h4 class="cbx-inline-3bf8d9b412">Log Payment Out</h4>
            
            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Voucher ID</label>
                    <input type="text" id="txnIdDisplay" class="form-input readonly-input" value="Auto-Generated" readonly tabindex="-1">
                </div>
                <div>
                    <label class="form-label">Date *</label>
                    <input type="date" class="form-input" id="txnDate" required>
                </div>
                <div>
                    <label class="form-label">Voucher Type *</label>
                    <select id="txnType" class="form-input" required>
                        <option value="Payment">Payment (Vendor/Salary/Refund)</option>
                        <option value="Expense">General Expense</option>
                    </select>
                </div>
            </div>

            <div class="input-group three-cols">
                <div class="cbx-inline-1f61f29863">
                    <label class="form-label">Payee / Vendor Name *</label>
                    <input type="text" id="patientName" class="form-input" placeholder="Name of person/company receiving payment" required>
                </div>
                <div>
                    <label class="form-label">Branch *</label>
                    <select id="txnBranch" class="form-input" required>
                        <option value="">Loading Branches...</option>
                    </select>
                </div>
            </div>

            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Payment Mode</label>
                    <select id="txnMode" class="form-input">
                        <option value="Cash">Cash</option>
                        <option value="Bank/UPI">Bank (Card/UPI/Net)</option>
                    </select>
                </div>
                <div class="cbx-inline-1f61f29863">
                    <label class="form-label">Reference / Cheque No.</label>
                    <input type="text" id="txnRef" class="form-input" placeholder="Optional reference details">
                </div>
            </div>

            <div class="input-group three-cols cbx-inline-08f5d31173">
                <div>
                    <label class="form-label cbx-inline-f75d63c1ee">Amount Paid Out (₹) *</label>
                    <input type="number" id="txnCashOut" class="form-input cbx-inline-6375761098" placeholder="0.00" required>
                </div>
                <div class="cbx-inline-1f61f29863">
                    <label class="form-label">Particulars / Notes</label>
                    <input type="text" id="txnNotes" class="form-input" placeholder="What is this payment for?">
                </div>
            </div>

            <div class="cbx-inline-d50ab04c47">
                <button type="button" class="btn-outline cbx-inline-5cfbad9ed3" onclick="window.resetTxnForm()">Clear Form</button>
                <button type="button" class="btn-primary" id="saveTxnBtn" onclick="window.saveTransaction()">Save Payment</button>
            </div>
        </form>
    </div>

    <div class="table-container">
        
        <div class="ledger-summary-banner">
            <div class="ledger-box">
                <h5>Total Payments</h5>
                <p class="cbx-inline-7e65b65c5e" id="ledgerTotalPayments">₹0.00</p>
            </div>
            <div class="ledger-box">
                <h5>Total Expenses</h5>
                <p class="cbx-inline-f75d63c1ee" id="ledgerTotalExpenses">₹0.00</p>
            </div>
            <div class="ledger-box cbx-inline-4d20d0a9a0">
                <h5>Total Outflow</h5>
                <p class="cbx-inline-f75d63c1ee" id="ledgerTotalOut">₹0.00</p>
            </div>
        </div>

        <div class="table-header">
            <div class="cbx-inline-101e0706b7">
                <h4>Payment & Expense Ledger</h4>
                <button class="btn-outline no-print cbx-inline-c4a2c401c9" onclick="window.print()">
                    <span class="material-symbols-rounded cbx-inline-b0adf8f15d">picture_as_pdf</span> Export Current View
                </button>
            </div>

            <div class="no-print cbx-inline-449f1abc20">
                <div class="cbx-inline-c779fa16be">
                    <input type="date" id="filterTxnDateFrom" class="form-input cbx-inline-a193cee37b" onchange="window.filterTxnTable()" title="From Date">
                    <span class="cbx-inline-72e4f08183">to</span>
                    <input type="date" id="filterTxnDateTo" class="form-input cbx-inline-a193cee37b" onchange="window.filterTxnTable()" title="To Date">
                </div>
                <select id="filterTxnType" class="form-input cbx-inline-a193cee37b" onchange="window.filterTxnTable()">
                    <option value="">All Payments & Expenses</option>
                    <option value="payment">Payment</option>
                    <option value="expense">Expense</option>
                </select>
                <div class="cbx-inline-65dec24f00">
                    <span class="material-symbols-rounded cbx-inline-15d3c175e3">search</span>
                    <input class="cbx-inline-8e63acf974" type="text" id="txnSearchInput" onkeyup="window.filterTxnTable()" placeholder="Search Payee Name or Notes...">
                </div>
                <button class="btn-outline cbx-inline-df76b1a362" onclick="window.clearTxnFilters()" title="Clear Filters">
                    <span class="material-symbols-rounded cbx-inline-b87efa5bc3">close</span>
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="saas-table">
                <thead>
                    <tr>
                        <th>Date & ID</th>
                        <th>Payee Name</th>
                        <th>Branch</th>
                        <th>Type & Mode</th>
                        <th>Ref & Notes</th>
                        <th>Amount Paid</th>
                        <th class="no-print cbx-inline-13cbe03b9a">Actions</th>
                    </tr>
                </thead>
                <tbody id="txnTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, addDoc, query, where, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.txnDataCache = {};
        window.allBranchesStringTxn = "";

        document.getElementById("txnDate").value = new Date().toISOString().split('T')[0];

        window.loadBranchesForTxn = async function() {
            const select = document.getElementById('txnBranch');
            if (window.currentUser && window.currentUser.role !== 'admin') {
                const userBranch = window.currentUser.branch;
                select.innerHTML = `<option value="${userBranch}">${userBranch}</option>`;
                select.style.pointerEvents = 'none';
                select.style.background = 'var(--grey-med)';
                window.allBranchesStringTxn = userBranch;
                return; 
            }
            try {
                const snap = await getDocs(collection(db, "branches"));
                let branchList = [];
                snap.forEach(doc => { if(doc.data().name) branchList.push(doc.data().name); });
                branchList.sort();
                window.allBranchesStringTxn = branchList.join(" | ");
                select.innerHTML = '<option value="">Select Branch</option>';
                branchList.forEach(bName => {
                    const option = document.createElement('option');
                    option.value = bName; option.text = bName; select.appendChild(option);
                });
            } catch(e) { select.innerHTML = '<option value="Main Branch">Main Branch</option>'; }
        };
        window.loadBranchesForTxn();

        window.loadTransactions = async function() {
            const tableBody = document.getElementById('txnTableBody');
            tableBody.innerHTML = '<tr><td class="cbx-inline-d5621a90fb" colspan="7">Loading payment vouchers...</td></tr>';

            try {
                let q;
                if (window.currentUser && window.currentUser.role !== 'admin') {
                    q = query(collection(db, "transactions"), where("branch", "==", window.currentUser.branch));
                } else {
                    q = collection(db, "transactions");
                }

                const querySnapshot = await getDocs(q);
                tableBody.innerHTML = ''; 
                window.txnDataCache = {};
                
                let txnList = [];
                let tPayments = 0;
                let tExpenses = 0;

                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    // FILTER SPECIFIC TO PAYMENTS & EXPENSES
                    if(data.type === 'Payment' || data.type === 'Expense') {
                        txnList.push({ id: doc.id, data: data });
                        if(data.type === 'Payment') tPayments += parseFloat(data.cashOut) || 0;
                        if(data.type === 'Expense') tExpenses += parseFloat(data.cashOut) || 0;
                    }
                });

                document.getElementById('ledgerTotalPayments').innerText = `₹${tPayments.toFixed(2)}`;
                document.getElementById('ledgerTotalExpenses').innerText = `₹${tExpenses.toFixed(2)}`;
                document.getElementById('ledgerTotalOut').innerText = `₹${(tPayments + tExpenses).toFixed(2)}`;

                if (txnList.length === 0) {
                    tableBody.innerHTML = '<tr><td class="cbx-inline-0bb40c1700" colspan="7">No payment vouchers recorded yet.</td></tr>';
                    return;
                }

                txnList.sort((a, b) => new Date(b.data.date || 0) - new Date(a.data.date || 0));

                txnList.forEach((item) => {
                    const data = item.data;
                    const docId = item.id; 
                    window.txnDataCache[docId] = data;
                    
                    let typeBadge = data.type === 'Payment' ? '<span class="badge badge-payment">Payment</span>' : '<span class="badge badge-expense">Expense</span>';
                    let amountHtml = `<strong class="cbx-inline-f75d63c1ee">- ₹${data.cashOut || 0}</strong>`;

                    const tr = document.createElement('tr');
                    tr.setAttribute("data-type", data.type.toLowerCase());
                    tr.setAttribute("data-date", data.date);
                    tr.setAttribute("data-search", `${data.name} ${data.txnId} ${data.notes} ${data.ref}`.toLowerCase());

                    tr.innerHTML = `
                        <td data-label="Date/ID"><strong>${data.date}</strong><br><span class="cbx-inline-2036dec300">${data.txnId || '--'}</span></td>
                        <td data-label="Payee"><strong>${data.name}</strong></td>
                        <td data-label="Branch"><span class="cbx-inline-81836152bb">${data.branch || 'Unassigned'}</span></td>
                        <td data-label="Type">${typeBadge}<br><span class="cbx-inline-fe4dbf42f0">${data.mode}</span></td>
                        <td data-label="Notes"><span class="cbx-inline-e71ae94b55">Ref: ${data.ref || '--'}</span><br><span class="cbx-inline-03a0430bdf">${data.notes}</span></td>
                        <td data-label="Amount">${amountHtml}</td>
                        <td class="no-print cbx-inline-13cbe03b9a" data-label="Actions">
                            <div class="cbx-inline-9be57b9c4b">
                                <span class="material-symbols-rounded cbx-inline-2fe7aff9c2" title="Print Voucher" onclick="window.printVoucher('${data.txnId}', '${data.name}', '${data.date}', '${data.type}', '${data.mode}', '${data.cashOut}', '${data.notes}')">receipt_long</span>
                                <span class="material-symbols-rounded cbx-inline-be28dee5fa" title="Edit" onclick="window.editTxn('${docId}')">edit</span>
                                <span class="material-symbols-rounded cbx-inline-ac5f01c68b" title="Delete" onclick="window.deleteTxn('${docId}')">delete</span>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) { console.error("Firebase Read Error:", error); }
        };

        window.loadTransactions();

        window.filterTxnTable = function() {
            const typeQuery = document.getElementById("filterTxnType").value.toLowerCase();
            const dateFromQuery = document.getElementById("filterTxnDateFrom").value;
            const dateToQuery = document.getElementById("filterTxnDateTo").value;
            const textQuery = document.getElementById("txnSearchInput").value.toLowerCase();
            const trs = document.getElementById("txnTableBody").getElementsByTagName("tr");

            for (let i = 0; i < trs.length; i++) {
                if (trs[i].cells.length === 1) continue; 
                const rowType = trs[i].getAttribute("data-type");
                const rowDate = trs[i].getAttribute("data-date");
                const rowSearch = trs[i].getAttribute("data-search");

                let show = true;
                if (typeQuery && rowType !== typeQuery) show = false;
                if (dateFromQuery && rowDate < dateFromQuery) show = false;
                if (dateToQuery && rowDate > dateToQuery) show = false;
                if (textQuery && rowSearch.indexOf(textQuery) === -1) show = false;
                trs[i].style.display = show ? "" : "none";
            }
        }

        window.clearTxnFilters = function() {
            document.getElementById("filterTxnDateFrom").value = "";
            document.getElementById("filterTxnDateTo").value = "";
            document.getElementById("filterTxnType").value = "";
            document.getElementById("txnSearchInput").value = "";
            window.filterTxnTable();
        }

        window.printVoucher = function(txnId, name, date, type, mode, amount, notes) {
            const branchesText = window.allBranchesStringTxn || 'Mahe | Chokli | Panoor | Koothuparamba';
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Payment Voucher - ${txnId}</title>
                    
                </head>
                <body>
                    <div class="header-row">
                        <div class="logo-area">
                            <img src="assets/logo.png" alt="Logo">
                            <img src="assets/name.png" alt="STRA CARE">
                        </div>
                        <div class="company-info">
                            <strong>+91 97449 02555 | +91 90612 07871</strong><br>
                            info@stracares.in | www.stracares.in<br>
                            Branches: ${branchesText}
                        </div>
                    </div>
                    <div class="cbx-inline-5efb2661e2">
                        <h2 class="cbx-inline-0308dda5cb">Payment Voucher</h2>
                    </div>
                    <div class="row"><strong>Voucher No:</strong> ${txnId}</div>
                    <div class="row"><strong>Date:</strong> ${date}</div>
                    <div class="box">
                        <div class="row"><strong>Paid To:</strong> <span>${name}</span></div>
                        <div class="row"><strong>Payment Type:</strong> <span>${type}</span></div>
                        <div class="row"><strong>Payment Mode:</strong> <span>${mode}</span></div>
                        <div class="row cbx-inline-8c16304746">
                            <strong>Particulars:</strong> <span class="cbx-inline-07d6b2fb01">${notes || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="amt">Amount Paid: ₹ ${amount}</div>
                    <div class="cbx-inline-9a9a51d3dc">
                        <div>_____________________<br>Authorized Signatory</div>
                        <div>_____________________<br>Receiver's Signature</div>
                    </div>
                    <div class="footer-text">Generated by CM/ERP&CRM</div>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        window.editTxn = function(docId) {
            const data = window.txnDataCache[docId];
            if(!data) return;
            document.getElementById('txnDocId').value = docId; 
            document.getElementById('txnIdDisplay').value = data.txnId; 
            document.getElementById('txnDate').value = data.date || '';
            document.getElementById('txnType').value = data.type || 'Payment';
            document.getElementById('patientName').value = data.name || '';
            document.getElementById('txnBranch').value = data.branch || '';
            document.getElementById('txnMode').value = data.mode || 'Cash';
            document.getElementById('txnRef').value = data.ref || '';
            document.getElementById('txnCashOut').value = data.cashOut || '';
            document.getElementById('txnNotes').value = data.notes || '';
            
            document.getElementById('saveTxnBtn').innerText = "Update Payment";
            const mc = document.getElementById('main-content');
            if(mc) mc.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deleteTxn = async function(docId) {
            if(confirm("Are you sure you want to permanently delete this payment voucher?")) {
                try {
                    await deleteDoc(doc(db, "transactions", docId));
                    alert("Voucher deleted.");
                    window.loadTransactions();
                } catch(e) { alert("Error deleting transaction."); }
            }
        }

        window.resetTxnForm = function() {
            document.getElementById('transaction-form').reset();
            document.getElementById('txnDocId').value = ''; 
            document.getElementById('txnIdDisplay').value = 'Auto-Generated'; 
            document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('saveTxnBtn').innerText = "Save Payment";
            if (window.currentUser && window.currentUser.role !== 'admin') {
                document.getElementById('txnBranch').value = window.currentUser.branch;
            }
        }

        window.saveTransaction = async function() {
            const saveBtn = document.getElementById('saveTxnBtn');
            const docId = document.getElementById('txnDocId').value; 
            
            const date = document.getElementById('txnDate').value;
            const type = document.getElementById('txnType').value;
            const branch = document.getElementById('txnBranch').value;
            const name = document.getElementById('patientName').value;
            const mode = document.getElementById('txnMode').value;
            const ref = document.getElementById('txnRef').value;
            const cashOut = document.getElementById('txnCashOut').value || 0;
            const notes = document.getElementById('txnNotes').value;

            if (!name || !date || !type || !branch || !cashOut) return alert("Required fields missing! Ensure amount is entered.");

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const payload = {
                date: date,
                type: type,
                branch: branch,
                mobile: "", // Not typically needed for vendor payments, but keeping field for schema consistency
                name: name,
                mode: mode,
                ref: ref,
                cashIn: 0, // Enforce 0 for payments out
                cashOut: parseFloat(cashOut),
                notes: notes,
                updatedAt: new Date()
            };

            try {
                if(docId) {
                    payload.txnId = document.getElementById('txnIdDisplay').value;
                    await updateDoc(doc(db, "transactions", docId), payload);
                    alert("Payment updated!");
                } else {
                    const now = new Date();
                    const dd = String(now.getDate()).padStart(2, '0');
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const yy = String(now.getFullYear()).slice(-2);
                    const hh = String(now.getHours()).padStart(2, '0');
                    const mins = String(now.getMinutes()).padStart(2, '0');
                    
                    payload.txnId = `TRN${dd}${mm}${yy}${hh}${mins}`;
                    payload.createdAt = now;
                    
                    await addDoc(collection(db, "transactions"), payload);
                    alert("Payment saved!");
                }
                window.resetTxnForm();
                window.loadTransactions();
            } catch (error) { console.error(error); alert("Failed to save."); }
            saveBtn.innerText = "Save Payment";
            saveBtn.disabled = false;
        }
    </script>
</div>
</body>
</html>
