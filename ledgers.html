<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stra Care - Ledgers Master</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>

<link rel="stylesheet" href="style.corebiq">
</head>
<body>

<div class="module-container" id="ledger-module">
    
    

    <div class="section-title">
        <span class="material-symbols-rounded">account_balance</span>
        Ledger Master (Chart of Accounts)
    </div>

    <div class="grid-layout">
        
        <!-- LEFT: ADD CATEGORY -->
        <div class="card cbx-inline-ecbc02f2ae">
            <h3 class="cbx-inline-0e72e420dc">Add Ledger Category</h3>
            <p class="cbx-inline-35d1e7c353">Create categories like Indirect Expenses, Purchases, Assets, etc.</p>
            
            <form onsubmit="event.preventDefault(); window.saveCategory();">
                <label class="form-label">Category Name *</label>
                <input type="text" id="newCategoryName" class="form-input" placeholder="e.g., Indirect Expense" required>
                <button type="submit" class="btn-primary" id="saveCatBtn">
                    <span class="material-symbols-rounded cbx-inline-35868dad24">add</span> Add Category
                </button>
            </form>
        </div>

        <!-- RIGHT: ADD LEDGER -->
        <div class="card">
            <h3 class="cbx-inline-0e72e420dc">Create / Edit Ledger</h3>
            
            <form id="ledger-form" onsubmit="event.preventDefault(); window.saveLedger();">
                <input type="hidden" id="docId" value="">
                
                <div class="input-group three-cols">
                    <div>
                        <label class="form-label">Ledger No.</label>
                        <input type="text" id="lNo" class="form-input" readonly placeholder="Auto-generated">
                    </div>
                    <div class="cbx-inline-1f61f29863">
                        <label class="form-label">Ledger Name *</label>
                        <input type="text" id="lName" class="form-input" placeholder="e.g., Electricity Bill, Supplier Name..." required>
                    </div>
                </div>

                <div class="input-group two-cols">
                    <div>
                        <label class="form-label">Ledger Category *</label>
                        <select id="lCategory" class="form-input" required>
                            <option value="">Loading Categories...</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Opening Balance</label>
                        <div class="cbx-inline-693434c7de">
                            <select id="lOpType" class="form-input cbx-inline-c01ab1ecd8">
                                <option value="Dr">Dr</option>
                                <option value="Cr">Cr</option>
                            </select>
                            <input type="number" id="lOpAmt" class="form-input cbx-inline-648149cea2" placeholder="0.00">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="form-label">Other Info (Bank details, GST No, Loan Info, etc.)</label>
                    <textarea id="lOtherInfo" class="form-input" rows="2" placeholder="Optional details..."></textarea>
                </div>

                <div class="cbx-inline-d1a5c60398">
                    <button type="button" class="btn-outline" onclick="window.resetLedgerForm()">Clear Form</button>
                    <button type="submit" class="btn-primary cbx-inline-0a8ca1da2b" id="saveLedgerBtn">
                        <span class="material-symbols-rounded">save</span> Save Ledger
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DIRECTORY TABLE -->
    <div class="table-container">
        <div class="cbx-inline-ddf0c7c1d9">
            <h4 class="cbx-inline-19eecab83a">Ledgers Directory</h4>
            <div class="cbx-inline-0483362a58">
                <span class="material-symbols-rounded cbx-inline-687f023c38">search</span>
                <input class="cbx-inline-c889b419e7" type="text" id="searchLedger" onkeyup="window.filterLedgers()" placeholder="Search ledgers...">
            </div>
        </div>

        <div class="table-responsive">
            <table class="saas-table">
                <thead>
                    <tr>
                        <th>Ledger No.</th>
                        <th>Ledger Name</th>
                        <th>Category</th>
                        <th>Opening Balance</th>
                        <th>Other Info</th>
                        <th class="cbx-inline-13cbe03b9a">Actions</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <tr><td class="cbx-inline-f2b9ba4a94" colspan="6">Loading ledgers...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js'; 
        import { collection, addDoc, query, getDocs, updateDoc, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.ledgerDataCache = {};
        window.nextLedgerCount = 1;

        // 1. Load Categories
        window.loadCategories = async function() {
            const select = document.getElementById('lCategory');
            try {
                const snap = await getDocs(collection(db, "ledger_categories"));
                
                // Auto-seed defaults if empty
                if(snap.empty) {
                    const defaults = ['Indirect Expense', 'Direct Expense', 'Purchase', 'Sales', 'Fixed Assets', 'Sundry Creditors', 'Sundry Debtors', 'Bank Accounts'];
                    for(let cat of defaults) {
                        await addDoc(collection(db, "ledger_categories"), { name: cat });
                    }
                    return window.loadCategories(); // Reload after seeding
                }

                let catList = [];
                snap.forEach(d => { if(d.data().name) catList.push(d.data().name); });
                catList.sort();

                select.innerHTML = '<option value="">Select a Category</option>';
                catList.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.text = c; select.appendChild(opt);
                });
            } catch(e) { console.error("Error loading categories", e); }
        };

        // 2. Save New Category
        window.saveCategory = async function() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            const btn = document.getElementById('saveCatBtn');

            if(!name) return;
            btn.disabled = true; btn.innerText = "Adding...";

            try {
                await addDoc(collection(db, "ledger_categories"), { name: name });
                input.value = '';
                await window.loadCategories();
                alert(`Category '${name}' added successfully!`);
            } catch(e) { alert("Failed to add category."); }
            
            btn.disabled = false; 
            btn.innerHTML = `<span class="material-symbols-rounded cbx-inline-35868dad24">add</span> Add Category`;
        };

        // 3. Load Ledgers & Auto-generate Ledger No.
        window.loadLedgers = async function() {
            const tbody = document.getElementById('ledgerTableBody');
            try {
                const snap = await getDocs(collection(db, "ledgers"));
                tbody.innerHTML = '';
                window.ledgerDataCache = {};
                
                // Set the next auto-ID based on total records
                window.nextLedgerCount = snap.size + 1;
                document.getElementById('lNo').value = `LD/CMB/${String(window.nextLedgerCount).padStart(3, '0')}`;

                if(snap.empty) {
                    tbody.innerHTML = '<tr><td class="cbx-inline-f77719404c" colspan="6">No ledgers found. Create one above.</td></tr>';
                    return;
                }

                let arr = [];
                snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                // Sort by Ledger No
                arr.sort((a, b) => (a.ledgerNo || '').localeCompare(b.ledgerNo || ''));

                arr.forEach(data => {
                    window.ledgerDataCache[data.id] = data;
                    
                    const badgeClass = data.opType === 'Dr' ? 'badge-dr' : 'badge-cr';
                    const balHtml = data.opAmt > 0 ? `<span class="badge ${badgeClass}">${data.opType} ${data.opAmt.toFixed(2)}</span>` : '<span class="cbx-inline-bfc60b4648">Nil</span>';

                    const tr = document.createElement('tr');
                    tr.className = "ledger-row";
                    tr.setAttribute("data-search", `${data.ledgerNo} ${data.name} ${data.category} ${data.otherInfo}`.toLowerCase());

                    tr.innerHTML = `
                        <td><strong>${data.ledgerNo}</strong></td>
                        <td><strong class="cbx-inline-da0d36d342">${data.name}</strong></td>
                        <td><span class="badge badge-cat">${data.category}</span></td>
                        <td>${balHtml}</td>
                        <td><span class="cbx-inline-15c5d568cc" title="${data.otherInfo || ''}">${data.otherInfo || '--'}</span></td>
                        <td class="cbx-inline-13cbe03b9a">
                            <div class="cbx-inline-3515d6b372">
                                <span class="material-symbols-rounded cbx-inline-be28dee5fa" onclick="window.editLedger('${data.id}')" title="Edit">edit</span>
                                <span class="material-symbols-rounded cbx-inline-ac5f01c68b" onclick="window.deleteLedger('${data.id}')" title="Delete">delete</span>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) { console.error("Error loading ledgers", error); }
        };

        // 4. Save Ledger
        window.saveLedger = async function() {
            const docId = document.getElementById('docId').value;
            const ledgerNo = document.getElementById('lNo').value;
            const name = document.getElementById('lName').value.trim();
            const category = document.getElementById('lCategory').value;
            const opType = document.getElementById('lOpType').value;
            const opAmt = parseFloat(document.getElementById('lOpAmt').value) || 0;
            const otherInfo = document.getElementById('lOtherInfo').value.trim();
            
            const btn = document.getElementById('saveLedgerBtn');

            if(!name || !category) return alert("Please fill the required fields.");

            btn.disabled = true; btn.innerText = "Saving...";

            const payload = {
                ledgerNo: ledgerNo,
                name: name,
                category: category,
                opType: opType,
                opAmt: opAmt,
                otherInfo: otherInfo,
                updatedAt: new Date()
            };

            try {
                if(docId) {
                    await updateDoc(doc(db, "ledgers", docId), payload);
                    alert("Ledger updated!");
                } else {
                    payload.createdAt = new Date();
                    await addDoc(collection(db, "ledgers"), payload);
                    alert("New Ledger saved!");
                }
                window.resetLedgerForm();
                window.loadLedgers();
            } catch(e) { console.error(e); alert("Error saving ledger."); }

            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-rounded">save</span> Save Ledger`;
        };

        // 5. Edit / Delete / Reset / Filter
        window.editLedger = function(id) {
            const data = window.ledgerDataCache[id];
            if(!data) return;
            document.getElementById('docId').value = id;
            document.getElementById('lNo').value = data.ledgerNo;
            document.getElementById('lName').value = data.name;
            document.getElementById('lCategory').value = data.category;
            document.getElementById('lOpType').value = data.opType || 'Dr';
            document.getElementById('lOpAmt').value = data.opAmt || '';
            document.getElementById('lOtherInfo').value = data.otherInfo || '';
            
            document.getElementById('saveLedgerBtn').innerHTML = `<span class="material-symbols-rounded">update</span> Update Ledger`;
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteLedger = async function(id) {
            if(confirm("Are you sure you want to permanently delete this Ledger?")) {
                try {
                    await deleteDoc(doc(db, "ledgers", id));
                    window.loadLedgers();
                } catch(e) { alert("Error deleting ledger."); }
            }
        };

        window.resetLedgerForm = function() {
            document.getElementById('ledger-form').reset();
            document.getElementById('docId').value = '';
            document.getElementById('saveLedgerBtn').innerHTML = `<span class="material-symbols-rounded">save</span> Save Ledger`;
            document.getElementById('lNo').value = `LD/CMB/${String(window.nextLedgerCount).padStart(3, '0')}`;
        };

        window.filterLedgers = function() {
            const query = document.getElementById('searchLedger').value.toLowerCase();
            const rows = document.querySelectorAll('.ledger-row');
            rows.forEach(row => {
                const txt = row.getAttribute('data-search');
                row.style.display = txt.includes(query) ? '' : 'none';
            });
        };

        // Bootstrap Module
        window.loadCategories();
        window.loadLedgers();

    </script>
</div>
</body>
</html>
