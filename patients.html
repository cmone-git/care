<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Patient Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>

<link rel="stylesheet" href="style.corebiq">
</head>
<body>

<div class="module-container" id="patient-module">
    
    

    <div class="section-title">
        <h2 class="cbx-inline-ff227d0632">Patient Management</h2>
    </div>

    <div class="form-card">
        <h4 class="cbx-inline-6d9eef1a49">Register New Patient</h4>
        
        <form id="add-patient-form" onsubmit="event.preventDefault();">
            <div class="input-group three-cols">
                <div>
                    <label class="form-label">Patient ID</label>
                    <input type="text" id="patientIdInput" class="form-input readonly-input" value="Auto-Generated" readonly tabindex="-1">
                </div>

                <div class="cbx-inline-1f61f29863">
                    <label class="form-label">Mobile Number (Search / Validate) *</label>
                    <div class="cbx-inline-693434c7de">
                        <input type="tel" id="mobileInput" class="form-input cbx-inline-b14da2c4f4" placeholder="Enter 10-digit mobile number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        <button type="button" class="btn-verify" id="verifyBtn" onclick="window.verifyMobile()">Verify</button>
                    </div>
                    <div id="mobileValidationMsg" class="validation-msg"></div>
                </div>
            </div>

            <fieldset class="cbx-inline-aa63c45940" id="patientDetailsFieldset" disabled>
                
                <div class="input-group four-cols">
                    <div class="cbx-inline-1f61f29863">
                        <label class="form-label">Patient Name *</label>
                        <input type="text" id="patientName" class="form-input" placeholder="Full Name" required>
                    </div>
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" id="patientAge" class="form-input" placeholder="Years" min="1" max="120">
                    </div>
                    <div>
                        <label class="form-label">Category *</label>
                        <select id="patientCategory" class="form-input" required>
                            <option value="Normal">Normal</option>
                            <option value="Regular">Regular</option>
                            <option value="Both">Both (Admin Mark)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group three-cols">
                    <div>
                        <label class="form-label">Gender</label>
                        <select id="patientGender" class="form-input">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="cbx-inline-1f61f29863">
                        <label class="form-label">Preferred Branch</label>
                        <select id="patientBranch" class="form-input">
                            <option value="">Loading Branches...</option>
                        </select>
                    </div>
                    <div class="cbx-inline-d5b43342a2">
                        <label class="form-label">Address</label>
                        <textarea id="patientAddress" class="form-input" rows="2" placeholder="Full residential address..."></textarea>
                    </div>
                    <div class="cbx-inline-d5b43342a2">
                        <label class="form-label">Notes / Medical History</label>
                        <textarea id="patientNotes" class="form-input" rows="3" placeholder="Any specific notes or initial observations..."></textarea>
                    </div>
                </div>

                <div class="cbx-inline-528921ebe4">
                    <button type="button" class="btn-outline no-print cbx-inline-941fec2eff" onclick="window.resetForm()">Clear Form</button>
                    <button type="button" class="btn-primary no-print" id="saveBtn" onclick="window.savePatient()">Save Patient</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div class="table-container">
        
        <div class="table-header">
            
            <div class="cbx-inline-101e0706b7">
                <h4>Patient Directory</h4>
                <button class="btn-outline no-print" onclick="window.exportPatientsPDF()">
                    <span class="material-symbols-rounded cbx-inline-db93582eff">picture_as_pdf</span> Export
                </button>
            </div>

            <!-- Advanced Sorting & Filtering Bar -->
            <div class="no-print cbx-inline-449f1abc20">
                
                <select id="filterBranch" class="form-input cbx-inline-a193cee37b" onchange="window.filterAndSortTable()">
                    <option value="">All Branches</option>
                </select>

                <select id="filterCategory" class="form-input cbx-inline-a193cee37b" onchange="window.filterAndSortTable()">
                    <option value="">All Categories</option>
                    <option value="normal">Normal</option>
                    <option value="regular">Regular</option>
                    <option value="both">Both</option>
                </select>

                <select id="sortOption" class="form-input cbx-inline-a193cee37b" onchange="window.filterAndSortTable()">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name_asc">Name (A-Z)</option>
                    <option value="name_desc">Name (Z-A)</option>
                </select>

                <div class="cbx-inline-65dec24f00">
                    <span class="material-symbols-rounded cbx-inline-15d3c175e3">search</span>
                    <input class="cbx-inline-8e63acf974" type="text" id="patientSearchInput" onkeyup="window.filterAndSortTable()" placeholder="Search Name, Mobile, ID...">
                </div>

                <button class="btn-outline cbx-inline-df76b1a362" onclick="window.clearFilters()" title="Clear Filters">
                    <span class="material-symbols-rounded cbx-inline-b87efa5bc3">close</span>
                </button>

            </div>
            
        </div>
        
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Patient Name & ID</th>
                    <th>Mobile No.</th>
                    <th>Demographics / Branch</th>
                    <th>Address Details</th>
                    <th class="no-print">Actions</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAcO1L2Za7dzILxylmMkRTSx0FBVu_EEoM",
            authDomain: "cmf001stra.firebaseapp.com",
            projectId: "cmf001stra",
            storageBucket: "cmf001stra.firebasestorage.app",
            messagingSenderId: "763958641347",
            appId: "1:763958641347:web:316876bc2340b26bd21876",
            measurementId: "G-770FBR88LJ"
        };

        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);

        // --- 0. LOAD BRANCHES (UPDATED FOR ROLE BASED ACCESS) ---
        window.loadBranchesForPatient = async function() {
            const select = document.getElementById('patientBranch');
            const filterSelect = document.getElementById('filterBranch');
            
            // SECURITY: If standard user, lock the dropdown to their branch only
            if (window.currentUser && window.currentUser.role !== 'admin') {
                const userBranch = window.currentUser.branch;
                select.innerHTML = `<option value="${userBranch}">${userBranch}</option>`;
                select.style.pointerEvents = 'none';
                select.style.background = 'var(--grey-med)';
                
                filterSelect.innerHTML = `<option value="${userBranch}">${userBranch}</option>`;
                filterSelect.style.pointerEvents = 'none';
                filterSelect.style.background = 'var(--grey-med)';
                return; // Stop executing
            }

            // Normal flow for Admin
            try {
                const snap = await getDocs(collection(db, "branches"));
                let branchList = [];
                
                snap.forEach(doc => {
                    const bName = doc.data().name;
                    if(bName) branchList.push(bName);
                });

                branchList.sort();
                select.innerHTML = '<option value="">Select Branch</option>';
                filterSelect.innerHTML = '<option value="">All Branches</option>';
                
                branchList.forEach(bName => {
                    select.appendChild(new Option(bName, bName));
                    filterSelect.appendChild(new Option(bName, bName));
                });
            } catch(e) {
                console.error("Error loading branches", e);
                select.innerHTML = '<option value="">Select Branch</option><option value="Mahe">Mahe</option>';
            }
        };

        window.loadBranchesForPatient();

        // --- 1. FILTER AND SORT FUNCTION ---
        window.filterAndSortTable = function() {
            const branchQuery = document.getElementById("filterBranch").value.toLowerCase();
            const categoryQuery = document.getElementById("filterCategory").value.toLowerCase();
            const sortQuery = document.getElementById("sortOption").value;
            const textQuery = document.getElementById("patientSearchInput").value.toLowerCase();

            const tableBody = document.getElementById("patientTableBody");
            const rows = Array.from(tableBody.getElementsByTagName("tr"));
            
            // 1. First, apply filters (display: '' or display: 'none')
            rows.forEach(row => {
                if (row.cells.length === 1) return; // Skip "loading/empty" status rows
                
                const rowBranch = (row.getAttribute("data-branch") || "").toLowerCase();
                const rowCategory = (row.getAttribute("data-category") || "").toLowerCase();
                const rowSearch = (row.getAttribute("data-search") || "").toLowerCase();

                let show = true;
                if (branchQuery && rowBranch !== branchQuery) show = false;
                if (categoryQuery && rowCategory !== categoryQuery) show = false;
                if (textQuery && rowSearch.indexOf(textQuery) === -1) show = false;

                row.style.display = show ? "" : "none";
            });

            // 2. Second, execute sorting logic
            rows.sort((a, b) => {
                if (a.cells.length === 1 || b.cells.length === 1) return 0;

                if (sortQuery === 'name_asc' || sortQuery === 'name_desc') {
                    const nameA = a.getAttribute('data-name').toLowerCase();
                    const nameB = b.getAttribute('data-name').toLowerCase();
                    if (nameA < nameB) return sortQuery === 'name_asc' ? -1 : 1;
                    if (nameA > nameB) return sortQuery === 'name_asc' ? 1 : -1;
                    return 0;
                } else {
                    // Time based sorting
                    const timeA = parseInt(a.getAttribute('data-time') || 0);
                    const timeB = parseInt(b.getAttribute('data-time') || 0);
                    return sortQuery === 'newest' ? timeB - timeA : timeA - timeB;
                }
            });

            // 3. Re-append sorted rows to the DOM
            rows.forEach(row => tableBody.appendChild(row));
        }

        window.clearFilters = function() {
            if (window.currentUser && window.currentUser.role === 'admin') {
                document.getElementById("filterBranch").value = "";
            }
            document.getElementById("filterCategory").value = "";
            document.getElementById("sortOption").value = "newest";
            document.getElementById("patientSearchInput").value = "";
            window.filterAndSortTable();
        }

        // --- 2. EXPORT PDF FUNCTION ---
        window.exportPatientsPDF = function() {
            window.print();
        }

        // --- 3. LOAD PATIENTS (UPDATED FOR ROLE BASED ACCESS) ---
        window.loadPatients = async function() {
            const tableBody = document.getElementById('patientTableBody');
            tableBody.innerHTML = '<tr><td class="cbx-inline-d5621a90fb" colspan="5">Loading patients...</td></tr>';

            try {
                let q;
                // Admin gets all, Branch users get only their branch
                if (window.currentUser && window.currentUser.role !== 'admin') {
                    q = query(collection(db, "patients"), where("branch", "==", window.currentUser.branch));
                } else {
                    q = query(collection(db, "patients"));
                }

                const querySnapshot = await getDocs(q);
                tableBody.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td class="cbx-inline-0bb40c1700" colspan="5">No patients found.</td></tr>';
                    return;
                }

                // Initial fetch array mapped so sorting can be done inside filterAndSortTable naturally.
                let pList = [];
                querySnapshot.forEach(doc => pList.push({ id: doc.id, data: doc.data() }));

                pList.forEach((item) => {
                    const data = item.data;
                    const catLower = (data.category || 'Normal').toLowerCase();
                    const createdAtTime = data.createdAt ? (data.createdAt.toMillis ? data.createdAt.toMillis() : new Date(data.createdAt).getTime()) : 0;
                    
                    let badgeClass = 'badge-normal';
                    if(catLower === 'regular') badgeClass = 'badge-regular';
                    if(catLower === 'both') badgeClass = 'badge-both';

                    const tr = document.createElement('tr');
                    tr.setAttribute("data-branch", data.branch || '');
                    tr.setAttribute("data-category", data.category || 'Normal');
                    tr.setAttribute("data-name", data.name || '');
                    tr.setAttribute("data-time", createdAtTime);
                    tr.setAttribute("data-search", `${data.name || ''} ${data.mobile || ''} ${data.patientId || ''}`.toLowerCase());

                    tr.innerHTML = `
                        <td data-label="Patient"><div class="patient-info"><strong>${data.name}</strong><span class="pid">${data.patientId}</span></div></td>
                        <td data-label="Mobile">
                            <span class="cbx-inline-9a37856b2b">${data.mobile}</span>
                            <div class="mobile-cta-container no-print">
                                <a href="tel:${data.mobile}" class="cta-link" title="Call"><span class="material-symbols-rounded cbx-inline-d9a5a0815c">call</span></a>
                                <a href="https://wa.me/91${data.mobile}" class="cta-link" target="_blank" title="WhatsApp"><span class="material-symbols-rounded cbx-inline-19d94794af">chat</span></a>
                            </div>
                        </td>
                        <td data-label="Demographics">
                            <span class="badge ${badgeClass}">${data.category || 'Normal'}</span><br>
                            ${data.age || '--'} Yrs / ${data.gender || '--'}<br>
                            <span class="cbx-inline-81836152bb">${data.branch || 'Unassigned'}</span>
                        </td>
                        <td data-label="Address"><span class="cbx-inline-59110311b2">${data.address || '--'}</span></td>
                        <td class="no-print" data-label="Actions">
                            <div class="cbx-inline-fd8310542e">
                                <span class="material-symbols-rounded cbx-inline-2fe7aff9c2" title="View Notes">assignment</span>
                                <span class="material-symbols-rounded cbx-inline-3ef7530d6d" title="Edit">edit</span>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // Apply default Sort (Newest) and current filter states on load
                window.filterAndSortTable();

            } catch (error) {
                console.error("Firebase Read Error:", error);
                tableBody.innerHTML = '<tr><td class="cbx-inline-b8e5dc920d" colspan="5">Error loading data.</td></tr>';
            }
        };

        window.loadPatients();

        // --- 4. SMART VERIFY (CROSS-CHECKS DATABASE) ---
        window.verifyMobile = async function() {
            const mobileInput = document.getElementById('mobileInput').value;
            const validationMsg = document.getElementById('mobileValidationMsg');
            const fieldset = document.getElementById('patientDetailsFieldset');
            const verifyBtn = document.getElementById('verifyBtn');
            
            validationMsg.className = 'validation-msg';

            if (mobileInput.length !== 10) {
                validationMsg.innerText = "Please enter a valid 10-digit mobile number.";
                validationMsg.classList.add('error');
                fieldset.disabled = true;
                return;
            }

            verifyBtn.innerText = "Checking...";
            verifyBtn.disabled = true;

            try {
                // Check if they are already in the PATIENTS database
                const pSnap = await getDocs(query(collection(db, "patients"), where("mobile", "==", mobileInput)));

                if (!pSnap.empty) {
                    let existingName = pSnap.docs[0].data().name; 
                    validationMsg.innerHTML = `Patient already registered as <strong>${existingName}</strong>! Directory filtered below.`;
                    validationMsg.classList.add('error');
                    fieldset.disabled = true;
                    
                    // Auto-search the table to show them the duplicate
                    document.getElementById('patientSearchInput').value = mobileInput;
                    window.filterAndSortTable();
                } else {
                    // Brand new number
                    validationMsg.innerText = "Number is available. Please fill out the details.";
                    validationMsg.classList.add('success');
                    fieldset.disabled = false;
                    document.getElementById('patientName').focus();
                    
                    // Clear search if it was previously active
                    document.getElementById('patientSearchInput').value = "";
                    window.filterAndSortTable();
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                validationMsg.innerText = "Error checking database.";
                validationMsg.classList.add('error');
            }

            verifyBtn.innerText = "Verify";
            verifyBtn.disabled = false;
        }

        // --- 5. SAVE PATIENT ---
        window.savePatient = async function() {
            const saveBtn = document.getElementById('saveBtn');
            const mobile = document.getElementById('mobileInput').value;
            const name = document.getElementById('patientName').value;
            const age = document.getElementById('patientAge').value;
            const category = document.getElementById('patientCategory').value;
            const gender = document.getElementById('patientGender').value;
            const branch = document.getElementById('patientBranch').value;
            const address = document.getElementById('patientAddress').value;
            const notes = document.getElementById('patientNotes').value;

            if (!name || !mobile || !category) {
                alert("Patient Name, Mobile Number, and Category are required!");
                return;
            }

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                const generatedId = "P" + Math.floor(Math.random() * 90000 + 10000);
                await addDoc(collection(db, "patients"), {
                    patientId: generatedId,
                    mobile: mobile,
                    name: name,
                    age: age,
                    category: category,
                    gender: gender,
                    branch: branch,
                    address: address,
                    notes: notes,
                    createdAt: new Date()
                });

                alert(`Success! Patient saved with ID: ${generatedId}`);
                window.resetForm();
                window.loadPatients();

            } catch (error) {
                console.error("Firebase Save Error:", error);
                alert("Failed to save patient.");
            }

            saveBtn.innerText = "Save Patient";
            saveBtn.disabled = false;
        }

        // --- 6. RESET FORM ---
        window.resetForm = function() {
            // Hard reset the form HTML logic
            document.getElementById('add-patient-form').reset();
            
            // UI specific reset overrides
            document.getElementById('mobileValidationMsg').className = 'validation-msg';
            document.getElementById('mobileValidationMsg').innerText = '';
            document.getElementById('patientDetailsFieldset').disabled = true;
            document.getElementById('patientCategory').value = 'Normal';
            
            // Ensure branch stays locked to standard user branch if applicable
            if (window.currentUser && window.currentUser.role !== 'admin') {
                document.getElementById('patientBranch').value = window.currentUser.branch;
            } else {
                document.getElementById('patientBranch').value = "";
            }
        }
    </script>

</div>
</body>
</html>
